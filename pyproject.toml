[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lembara-profit-analyzer"
version = "0.1.0"
description = "Real profit per product for small Etsy and multi-channel handmade shops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
etsy-profit = "etsy_profit.cli:main"
etsy-profit-connect = "etsy_profit.cli:connect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
